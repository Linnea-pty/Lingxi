spring.application.name=Lingxi

# ---------------- 数据源（本地开发：docker 容器 lingxi / mysql 8.4） ----------------
# 注意：不要写 characterEncoding=utf8mb4，Connector/J 8.x 会报 Unsupported character encoding
# allowPublicKeyRetrieval 供 caching_sha2_password 在非 SSL 连接下取公钥；生产环境应改走 SSL 并外部化密码
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/lingxi?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=123456

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=600000

# ---------------- 数据库迁移（Flyway） ----------------
# 迁移脚本在 classpath:db/migration，应用启动时按版本号顺序执行，执行记录落 flyway_schema_history。
# 校验和校验默认开启：已应用脚本被改动会直接启动失败，避免「代码与库结构不一致」潜伏到运行期
# （存量库 baseline 后 V1~V3 属于 below baseline，不执行也不再校验；但它们仍必须保持不可变——
#  否则新环境按新内容建表，会与老库结构分叉）。
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# 存量库（表已建、还没有 flyway_schema_history）首次接入：把 V1~V3 记为已应用（baseline），
# 之后只执行 V4+。空库不受影响——Flyway 判空后仍从 V1 全量执行，两条路径终态一致。
# 新增脚本请从 V4 起续号，不要改 V1~V3。
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=3
spring.flyway.baseline-description=init schema plus username hardening patches

# ---------------- MyBatis-Plus ----------------
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.type-aliases-package=com.linnea.lingxi.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.banner=false
# 主键由数据库自增分配，对应 DDL 的 AUTO_INCREMENT
mybatis-plus.global-config.db-config.id-type=auto
# 逻辑删除统一映射到 is_deleted（各实体无该属性时自动不生效）
mybatis-plus.global-config.db-config.logic-delete-field=isDeleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

# 开发期打印 Mapper 层 SQL
logging.level.com.linnea.lingxi.mapper=debug

# ---------------- 鉴权 JWT ----------------
# 密钥只允许由环境变量注入（Base64 编码的 >=256bit 随机串），禁止写入仓库或代码常量。
# 本地生成示例（PowerShell）：
#   $b=[byte[]]::new(32); (New-Object Random).NextBytes($b); [Convert]::ToBase64String($b) | Set-Content .jwt-secret
#   $env:JWT_SECRET=Get-Content .jwt-secret
# 未设置或密钥强度不足时，JwtTokenProvider 构造即抛错，应用启动失败（Fail-Fast）
app.jwt.secret=${JWT_SECRET}
# 访问令牌有效期 2 小时：决定单个令牌最多能用多久，也决定「令牌被盗后最坏的影响窗口」
app.jwt.access-token-expiration=7200000
# 刷新令牌有效期 7 天：只能用于换发新令牌，且每次换发即轮换（旧令牌同一时刻失效）
app.jwt.refresh-token-expiration=604800000
# 【吊销时间在这里改】登出后访问令牌在 Redis 中标记「已吊销」的保留时长（毫秒）。
# 该值必须 >= app.jwt.access-token-expiration，否则标记先过期、旧令牌又能继续用；
# 设得比访问令牌有效期长只是多占 Redis 内存，不会延长令牌本身的寿命（令牌自带 exp）。
app.jwt.revoked-token-retention=7200000

# ---------------- 本地上传（头像） ----------------
# 头像落盘根目录：/uploads/** 静态映射到该目录，avatar_url 存的是 /uploads/avatar/{userId}/{file} 相对地址。
# 生产环境建议挂载独立数据卷（容器内路径），避免随镜像重建丢失。
app.upload.avatar-dir=${UPLOAD_DIR:uploads}
# 单文件上限 2MB 与 AvatarStorage 内的业务校验值保持一致：容器层先拦，业务层再兜底
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# ---------------- 接口文档（SpringDoc / Swagger UI） ----------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:true}

# ---------------- Redis ----------------
# 本地容器带 --requirepass（见 compose.yaml），不带密码时 Lettuce 首包即 NOAUTH 失败，
# 幂等栅栏会走 fail-open 导致重复写；生产环境应改为环境变量注入。
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD:123456}
spring.data.redis.timeout=3000ms
spring.data.redis.connect-timeout=3000ms
