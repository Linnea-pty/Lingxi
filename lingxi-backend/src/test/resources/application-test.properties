# ============================================================
# 测试专用配置（profile: test）
# 只放「无法由 Testcontainers 动态注入」的项：密钥、容器生命周期、日志噪音。
# 数据源与 Redis 连接地址由 AbstractIntegrationTest 的容器动态注入，此处不得硬编码，
# 否则会绕过容器、连到本机已启动的服务上，测试就变成不可重复的。
# ============================================================

# JWT 签名密钥：固定的测试专用值（Base64，33 字节），仅在 test profile 生效。
# 生产环境仍只允许环境变量 JWT_SECRET 注入，代码与测试资源都不出现生产密钥。
app.jwt.secret=bGluZ3hpLXRlc3Qtb25seS1qd3Qtc2VjcmV0LTMyYnl0ZXM=

# 关闭 spring-boot-docker-compose 的生命周期管理：集成测试自管容器，
# 若交给 compose 插件接管，会与本机已启动的 lingxi_mysql / lingxi_redis 争用 3306 与 6379。
spring.docker.compose.enabled=false

# 接口文档不参与测试，关掉可减少上下文装配与启动耗时
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# 容器内的 SQL 日志量大且无法用于排查断言失败，压到 info 避免淹没测试输出
logging.level.com.linnea.lingxi.mapper=info
